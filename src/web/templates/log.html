<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观鸟记录 - 飞羽志</title><link href="/lib/css/bootstrap.min.css" rel="stylesheet"><style>
body{font-size:14px;background:#f5f6fa}.log-shell{height:calc(100vh - 56px);display:grid;grid-template-columns:310px 1fr}.directory{background:#fff;border-right:1px solid #ddd;overflow:auto}.detail{overflow:auto;padding:24px}.tree-button{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px}.tree-button:hover,.tree-button.active{background:#6958cf;color:#fff}.month{padding-left:14px}.entry{padding-left:28px}.metric{background:#f1f3f8;border-radius:9px;padding:12px}.species-row{display:grid;grid-template-columns:1.4fr .8fr .5fr;gap:12px;padding:10px;border-bottom:1px solid #eee}@media(max-width:991px){.log-shell{display:block}.directory{display:none}.directory.show{display:block;position:fixed;z-index:1040;inset:56px 20% 0 0}.detail{padding:15px}}
</style></head><body>{% with active_page='log' %}{% include 'navbar.html' %}{% endwith %}
<div class="log-shell"><aside class="directory p-3" id="recordDirectory"><input id="recordSearch" class="form-control mb-3" placeholder="搜索日期、地点或鸟种"><div id="recordTree">加载中…</div></aside><main class="detail" id="recordDetail"><div class="d-flex justify-content-between mb-3"><button class="btn btn-outline-secondary d-lg-none" onclick="toggleDirectory()">目录</button><div class="ms-auto"><button class="btn btn-outline-primary" onclick="pullRecords()">拉取观鸟中心记录</button> <button class="btn btn-primary" onclick="openSync()">同步到 eBird</button></div></div><div id="emptyDetail" class="text-center text-muted py-5">请从左侧选择一条观鸟记录</div><section id="detailContent" hidden><h3 id="detailTitle"></h3><p id="detailMeta" class="text-muted"></p><div class="row g-2 mb-3" id="metrics"></div><ul class="nav nav-tabs"><li class="nav-item"><button class="nav-link active">鸟种记录</button></li><li class="nav-item"><a id="galleryLink" class="nav-link">外拍照片</a></li><li class="nav-item"><button class="nav-link">同步历史</button></li></ul><div id="speciesList" class="bg-white"></div></section></main></div>
<div class="modal fade" id="syncModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">同步到 eBird</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="progress mb-3"><div class="progress-bar" style="width:25%">1 / 4</div></div><div id="syncStep">获取与绑定 → 鸟种映射 → 清单信息 → 预览与导出</div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button><button class="btn btn-primary" onclick="loadCandidates()">查找候选报告</button></div></div></div></div>
<script src="/lib/js/bootstrap.bundle.min.js"></script><script>
let records=[],selected=null;const make=(tag,value,cls='')=>{const e=document.createElement(tag);e.textContent=value;e.className=cls;return e};const date=v=>v&&v.length>=8?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`:(v||'未知日期');
function groups(items){const root={};items.forEach(r=>{const y=(r.start_date||'未知').slice(0,4),m=(r.start_date||'未知').slice(4,6)||'未知';((root[y]??={})[m]??=[]).push(r)});return root}
function renderTree(){const q=recordSearch.value.trim().toLowerCase();recordTree.replaceChildren();Object.entries(groups(records.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)))).sort().reverse().forEach(([y,months])=>{recordTree.append(make('div',`${y} 年`,'fw-bold mt-2'));Object.entries(months).sort().reverse().forEach(([m,items])=>{recordTree.append(make('div',`${m} 月 · ${items.length} 次`,'month text-muted small mt-2'));items.forEach(r=>{const b=make('button',`${date(r.start_date)} · ${r.location||'未知地点'} · ${r.species_count}种`,'tree-button entry');b.onclick=()=>show(r,b);recordTree.append(b)})})})}
function show(r,b){selected=r;document.querySelectorAll('.tree-button').forEach(x=>x.classList.remove('active'));b.classList.add('active');emptyDetail.hidden=true;detailContent.hidden=false;detailTitle.textContent=r.location||r.outing_name||'未命名外拍';detailMeta.textContent=`${date(r.start_date)} · ${r.photo_count} 张照片`;galleryLink.href=`/gallery?outing_id=${r.outing_id}`;metrics.replaceChildren();[['鸟种',r.species_count],['新种',r.new_species_count],['照片',r.photo_count]].forEach(([k,v])=>{const c=make('div','', 'col-4');c.append(make('div',`${v} ${k}`,'metric'));metrics.append(c)});speciesList.replaceChildren();r.species.forEach(s=>{const row=make('div','', 'species-row');row.append(make('div',s.cn||s.scientific_name),make('div',s.scientific_name||''),make('div',`${s.photo_count}张`));speciesList.append(row)});if(innerWidth<992)toggleDirectory(false)}
async function load(){const data=await(await fetch('/api/log')).json();records=data.records||[];renderTree()}async function pullRecords(){const d=new Date().toISOString().slice(0,10).replaceAll('-',''),from=prompt('起始日期 YYYYMMDD',d),to=prompt('结束日期 YYYYMMDD',d);if(!from||!to)return;const r=await fetch('/api/records/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date_from:from,date_to:to})});alert(r.ok?'拉取完成':'拉取失败，请检查设置中的 Token')}function openSync(){if(!selected)return alert('请先选择观鸟记录');new bootstrap.Modal('#syncModal').show()}async function loadCandidates(){const d=await(await fetch(`/api/records/candidates?outing_id=${selected.outing_id}`)).json();syncStep.textContent=d.candidates?.length?`找到 ${d.candidates.length} 份候选报告，请选择并继续确认。`:'没有找到候选报告，请先拉取对应日期。'}function toggleDirectory(force){recordDirectory.classList.toggle('show',force)}recordSearch.addEventListener('input',renderTree);load();
</script></body></html>

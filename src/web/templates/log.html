<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>观鸟记录 - 飞羽志 WingScribe</title>
    <link rel="icon" type="image/x-icon" href="/lib/favicon.ico">
    <link href="/lib/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-size: 14px; }
        .record-card { transition: transform 0.15s; }
        .record-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .species-chip { cursor: pointer; }
        .species-chip:hover { background: #e9ecef; }
        .year-filter .btn.active { background: #0d6efd; color: white; border-color: #0d6efd; }
        .summary-bar { background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%); color: white; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        .summary-number { font-size: 2rem; font-weight: 700; }
        .new-badge { background: #198754; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
    </style>
</head>
<body>
    {% with active_page='log' %}{% include 'navbar.html' %}{% endwith %}

    <div class="container-fluid mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1">📝 观鸟记录</h4>
                <p class="text-muted mb-0">按日期聚合的每次外拍与观测物种</p>
            </div>
            <div class="btn-group year-filter" id="yearFilter">
                <button class="btn btn-outline-primary btn-sm active" data-year="">全部</button>
            </div>
        </div>

        <div class="summary-bar d-flex gap-4 flex-wrap">
            <div class="text-center">
                <div class="summary-number" id="summaryOutings">0</div>
                <div class="small opacity-75">次外拍</div>
            </div>
            <div class="text-center">
                <div class="summary-number" id="summarySpecies">0</div>
                <div class="small opacity-75">种鸟</div>
            </div>
            <div class="text-center">
                <div class="summary-number" id="summaryPhotos">0</div>
                <div class="small opacity-75">张照片</div>
            </div>
        </div>

        <div id="logContainer" class="row g-3">
            <div class="col-12 text-center text-muted py-5">
                加载中...
            </div>
        </div>
    </div>

    <script src="/lib/js/bootstrap.bundle.min.js"></script>
    <script>
        let allRecords = [];
        let currentYear = '';

        async function loadYears() {
            try {
                const resp = await fetch('/api/log/years');
                if (!resp.ok) throw new Error('请求失败');
                const data = await resp.json();
                if (data.status !== 'success') throw new Error(data.message || '未知错误');

                const filterEl = document.getElementById('yearFilter');
                data.years.forEach(year => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-outline-primary btn-sm';
                    btn.textContent = year;
                    btn.dataset.year = year;
                    btn.addEventListener('click', () => {
                        filterEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentYear = year;
                        loadRecords(year);
                    });
                    filterEl.appendChild(btn);
                });
            } catch (err) {
                console.error('加载年份失败:', err);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '未知日期';
            const year = dateStr.slice(0, 4);
            const month = dateStr.slice(4, 6);
            const day = dateStr.slice(6, 8);
            return `${year}-${month || ''}-${day || ''}`.replace(/-$/, '');
        }

        function renderSpeciesList(species) {
            if (species.length === 0) return '<span class="text-muted">暂无识别记录</span>';
            return species.map(s => `
                <span class="species-chip badge bg-light text-dark border me-1 mb-1"
                      onclick="window.location.href='/gallery?species=${encodeURIComponent(s.cn || s.scientific_name)}'">
                    ${s.cn || s.scientific_name}
                    <span class="text-muted">(${s.photo_count})</span>
                    ${s.is_new ? '<span class="new-badge">新</span>' : ''}
                </span>
            `).join('');
        }

        function renderSummary(summary) {
            document.getElementById('summaryOutings').textContent = summary.total_outings;
            document.getElementById('summarySpecies').textContent = summary.total_species;
            document.getElementById('summaryPhotos').textContent = summary.total_photos;
        }

        function renderRecords(records) {
            const container = document.getElementById('logContainer');
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info">暂无观鸟记录。请先导入照片并运行识别。</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = records.map(r => `
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card record-card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h5 class="card-title mb-1">${r.outing_name || '未命名外拍'}</h5>
                                    <p class="card-text text-muted small mb-0">
                                        <i class="bi bi-calendar3"></i> ${formatDate(r.start_date)} ${r.end_date && r.end_date !== r.start_date ? ' ~ ' + formatDate(r.end_date) : ''}
                                        ${r.location ? ' · <i class="bi bi-geo-alt"></i> ' + r.location : ''}
                                    </p>
                                </div>
                                <a href="/gallery?outing_id=${r.outing_id}" class="btn btn-sm btn-outline-primary">图库</a>
                            </div>
                            <div class="d-flex gap-2 mb-3">
                                <span class="badge bg-primary">${r.photo_count} 张</span>
                                <span class="badge bg-success">${r.species_count} 种</span>
                                <span class="badge bg-info text-dark">${r.new_species_count} 新</span>
                            </div>
                            <div class="species-list">
                                ${renderSpeciesList(r.species)}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadRecords(year = '') {
            const container = document.getElementById('logContainer');
            container.innerHTML = '<div class="col-12 text-center text-muted py-5">加载中...</div>';
            try {
                const params = new URLSearchParams();
                if (year) params.append('year', year);
                const resp = await fetch('/api/log?' + params.toString());
                if (!resp.ok) throw new Error('请求失败');
                const data = await resp.json();
                if (data.status !== 'success') throw new Error(data.message || '未知错误');

                allRecords = data.records || [];
                renderSummary(data.summary || { total_outings: 0, total_species: 0, total_photos: 0 });
                renderRecords(allRecords);
            } catch (err) {
                container.innerHTML = `<div class="col-12"><div class="alert alert-danger">加载失败：${err.message}</div></div>`;
            }
        }

        document.getElementById('yearFilter').querySelector('button[data-year=""]').addEventListener('click', function() {
            document.getElementById('yearFilter').querySelectorAll('button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentYear = '';
            loadRecords('');
        });

        loadYears();
        loadRecords();
    </script>
</body>
</html>

paths:
  sources:
  - path: D:/照片/2026/testdata
    recursive: true
  db_path: data/test_pipeline.db
  supported_formats:
  - .jpg
  - .jpeg
  - .nef
  - .orf
  - .cr2
  - .cr3
  - .arw
  - .dng
  - .rw2
  output:
    root_dir: F:/temp
    structure_template: '{source_structure}/{filename}_{species_cn}_{confidence}'
    write_back_to_source: false
  references_path: data/references
  ioc_list_path: data/references/Multiling IOC 15.1_d.xlsx
  model_cache_dir: data/models
processing:
  device: auto
  yolo_model: data/models/yolo26n.pt
  confidence_threshold: 0.3
  blur_threshold: 40.0
  target_size: 640
  crop_padding: 200
recognition:
  mode: local
  top_k: 5
  region_filter: auto
  alternatives_threshold: 70
  low_confidence_threshold: 60
metadata:
  write_mode: xmp_sidecar
  generate_xmp_sidecar: true
quality:
  weights:
    clarity: 0.25
    contrast: 0.1
    position: 0.1
    exposure: 0.1
    pose: 0.2
    bif: 0.1
    focus: 0.15
  pose_upgrade_threshold:
    head_eye_visible: true
    flight_probability: 0.35
grouper:
  time_window: 5
web:
  host: 0.0.0.0
  port: 8000
  log_level: info

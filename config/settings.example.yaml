paths:
  sources:
    - path: "D:/Photos/Birds"
      recursive: true
  db_path: "data/birder.db"
  supported_formats: [".jpg", ".jpeg", ".nef", ".orf", ".cr2", ".cr3", ".arw", ".dng", ".rw2"]

processing:
  device: auto
  yolo_model: data/models/yolo26n.pt
  confidence_threshold: 0.5

recognition:
  mode: local
  top_k: 5

metadata:
  write_mode: "xmp_sidecar"
  generate_xmp_sidecar: true

quality:
  weights:
    clarity: 0.30
    contrast: 0.10
    position: 0.10
    exposure: 0.10
    pose: 0.20
    focus: 0.20
  pose_upgrade_threshold:
    head_eye_visible: true

grouper:
  time_window: 5

web:
  host: "0.0.0.0"
  port: 8000

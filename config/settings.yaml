paths:
  sources:
  - path: D:/照片
    recursive: true
  db_path: data/birder.db
  supported_formats:
  - .jpg
  - .jpeg
  - .nef
  - .orf
  - .cr2
  - .cr3
  - .arw
  - .dng
  - .rw2
  output:
    root_dir: D:/照片/data/processed
    structure_template: '{source_structure}/{filename}_{species_cn}_{confidence}'
    write_back_to_source: false
  references_path: ''
  ioc_list_path: ''
  model_cache_dir: ''
processing:
  device: auto
  yolo_model: data/models/yolo26n.pt
  confidence_threshold: 0.5
  target_size: 640
  crop_padding: 200
  blur_threshold: 40.0
recognition:
  mode: local
  top_k: 5
  region_filter: auto
  alternatives_threshold: 70
  low_confidence_threshold: 60
metadata:
  write_mode: xmp_sidecar
  generate_xmp_sidecar: true
quality:
  weights:
    clarity: 0.30
    contrast: 0.20
    exposure: 0.20
    subject_size: 0.20
    iso: 0.10
  pose_upgrade_threshold:
    head_eye_visible: true
grouper:
  time_window: 5
web:
  host: 0.0.0.0
  port: 8000
  log_level: info
